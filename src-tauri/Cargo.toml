[package]
name = "zen-todo"
version = "0.1.0"
description = "A lightweight floating todo list for Windows"
authors = ["Zen Todo"]
edition = "2021"

[lib]
name = "zen_todo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
